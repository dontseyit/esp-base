; Template for a new project on esp-base: copy this folder, pick a board, pio run.
; Arduino IDE users ignore this file and open Blank.ino.
[platformio]
src_dir = .
default_envs = esp32

[env]
; pioarduino: Arduino core 3.3.11 / ESP-IDF 5.5.5. The rolling "stable" release works too.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; Keep the ESP8266 and RP2040 backends that ESPAsyncWebServer declares out of the build.
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  https://github.com/dontseyit/esp-base.git#2.0.0
build_flags =
  -DFW_VERSION=\"0.1.0\"
build_src_filter = +<*.ino> +<*.cpp> +<*.c> +<*.h>
; Two 1.9 MB OTA slots: the default 1.25 MB slots are 85% full with esp-base alone.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
; The C3 and C6 only have the USB Serial/JTAG peripheral: ARDUINO_USB_MODE=1 is required with CDC on boot.
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2]
board = esp32-s2-saola-1
