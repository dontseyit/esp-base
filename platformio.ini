; Builds examples/Minimal against the library itself (symlink://.) for every
; supported target. Consumers do not use this file; see examples/Blank for a
; project template.
;
;   pio run                                                 tier 1 envs
;   pio run -e esp32c6 -e esp32s2                           tier 2
;   PLATFORMIO_SRC_DIR=examples/Blank pio run -e esp32-lean -e esp32c3-noweb   module flags
;   pio test -e native                                      host unit tests

[platformio]
src_dir = examples/Minimal
default_envs = esp32, esp32s3, esp32c3

[env]
; Pinned for reproducible builds: Arduino core 3.3.11, ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  symlink://.
  ESP32Async/AsyncTCP @ ^3.5.0
  ESP32Async/ESPAsyncWebServer @ ^3.12.0
  bblanchon/ArduinoJson @ ^7.4.0
build_flags =
  -Wall
  -Wextra
  -DFW_VERSION=\"dev\"
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two 1.9 MB OTA slots and a small SPIFFS: the example needs no filesystem and
; the default 1.25 MB slots are 85% full. Consumer projects choose their own.
board_build.partitions = min_spiffs.csv

; ---- Tier 1 (hardware tested) -------------------------------------------

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; Board manifest already sets ARDUINO_USB_MODE=1 (USB-JTAG CDC).
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
; C3 has only the USB-JTAG peripheral: ARDUINO_USB_MODE=1 is required for
; ARDUINO_USB_CDC_ON_BOOT to route Serial to it (board manifest does not set it).
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Tier 2 (build only) -------------------------------------------------

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2]
board = esp32-s2-saola-1

; ---- Module flags, built from examples/Blank (PLATFORMIO_SRC_DIR=examples/Blank) ---
; Nothing optional: no OTA, no app framework, debug logging compiled out.
[env:esp32-lean]
board = esp32dev
build_flags = ${env.build_flags} -DESPBASE_NO_OTA -DESPBASE_NO_APPS -DESPBASE_LOG_MAX_LEVEL=2

; No web server at all: WiFi, NVS, serial console, espota.
[env:esp32c3-noweb]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DESPBASE_NO_WEB -DESPBASE_NO_APPS

; ---- Host unit tests: pio test -e native -----------------------------------

[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=gnu++17 -Wall -Wextra -Isrc -Itest/shim
