; Builds examples/minimal against the library itself (symlink://.) for every
; supported target. Consumers do not use this file; see README "Quick start".

[platformio]
src_dir = examples/minimal/src
default_envs = esp32, esp32s3, esp32c3

[env]
; Pinned for reproducible builds: Arduino core 3.3.11, ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  symlink://.
  ESP32Async/AsyncTCP @ ^3.5.0
  ESP32Async/ESPAsyncWebServer @ ^3.12.0
  bblanchon/ArduinoJson @ ^7.4.0
build_flags =
  -Wall
  -Wextra
  -DFW_VERSION=\"dev\"
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two 1.9 MB OTA slots and a small SPIFFS: the example needs no filesystem and
; the default 1.25 MB slots are 85% full. Consumer projects choose their own.
board_build.partitions = min_spiffs.csv

; ---- Tier 1 (hardware tested) -------------------------------------------

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; Board manifest already sets ARDUINO_USB_MODE=1 (USB-JTAG CDC).
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
; C3 has only the USB-JTAG peripheral: ARDUINO_USB_MODE=1 is required for
; ARDUINO_USB_CDC_ON_BOOT to route Serial to it (board manifest does not set it).
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Tier 2 (build only) -------------------------------------------------

[env:esp32c6]
board = esp32-c6-devkitc-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2]
board = esp32-s2-saola-1

; ---- Host unit tests: pio test -e native -----------------------------------

[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
